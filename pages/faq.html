  <body>
    <header>
      <div class="gnb">
        <a href="/" class="logo">

        <a href="/pages/login.html" class="login-btn">로그인</a>

    </header>
    <main>
      <section class="feature">
        <div class="container">
          <div class="txt-wrap">
            <h2>FAQ 페이지</h2>
            <a href="/pages/items.html" class="view-btn">구경하러 가기</a>
          </div>
        </div> 
      </section>
      <section class="hot-item">
        <div class="container">
          <img src="/images/home_hotItem.png" alt="핫아이템섹션이미지">
          <div class="txt-wrap">
            <span class="keyword">Hot item</span>
            <h2>인기 상품을<br>확인해 보세요</h2>
            <p>가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
          </div>
        </div>
      </section>
      <section class="search">
        <div class="container reverse">
          <img src="/images/home_search.png" alt="검색섹션이미지">
          <div class="txt-wrap">
            <span class="keyword">Search</span>
            <h2>구매를 원하는<br>상품을 검색하세요</h2>
            <p>구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
          </div>
        </div>  
      </section>
      <section class="register">
        <div class="container">
          <img src="/images/home_register.png" alt="등록섹션이미지">
          <div class="txt-wrap">
            <span class="keyword">Register</span>
            <h2>판매를 원하는<br>상품을 등록하세요</h2>
            <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
          </div>
        </div>
      </section>
      <section class="banner">
        <div class="container">
          <div class="txt-wrap">
            <h2>믿을 수 있는<br> 판다마켓 중고 거래</h2>
          </div>
        </div> 
      </section>    
    </main>
    <footer>
      <div class="wrap">
        <span class="company">©codeit - 2024</span>
        <ul class="footer-nav">
          <li><a href="/pages/privacy.html">Privacy Policy</a></li>
